services:
  agent-node:
    build: .    
    networks:
      hw4net: 
        ipv4_address: 172.30.0.10

  web-lab:
    build: .
    networks:
      hw4net: 
        ipv4_address: 172.30.0.40

  mock-c2:
    build: .
    networks:
      hw4net:
        ipv4_address: 172.30.0.66

networks:
  hw4net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-hw4
    ipam:
      config:
        - subnet: 172.30.0.0/24
